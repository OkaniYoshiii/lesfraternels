services:
    database:
        container_name: lesfraternels_database
        image: mariadb:lts
        ports:
            - 3306:3306
        environment:
            - MARIADB_USER=${DATABASE_USER}
            - MARIADB_PASSWORD=${DATABASE_PASSWORD}
            - MARIADB_DATABASE=${DATABASE_NAME}
            - MARIADB_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
        volumes:
            - database:/var/lib/mysql
    adminer:
        container_name: lesfraternels_adminer
        image: adminer:5.4.1-standalone
        depends_on:
            - database
        ports:
            - 8080:8080

volumes:
    database:
